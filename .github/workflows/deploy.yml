name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Travel Frog web game
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/TravelFrogWeb.zip" https://github.com/Amy22707/Travel-Frog/releases/download/v0.2.3/TravelFrogWeb.zip
          unzip -q "$RUNNER_TEMP/TravelFrogWeb.zip" 'play/*' -d public/studio/travel-frog

      - uses: withastro/action@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
